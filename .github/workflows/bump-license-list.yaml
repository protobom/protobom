name: bump-license-list

on:
  schedule:
    # Weekly, Mondays at 06:00 UTC. The SPDX License List releases a few
    # times a year, so a weekly check is plenty.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions: {}

jobs:
  bump-license-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the bump branch
      pull-requests: write  # open the bump PR

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Find the latest SPDX License List release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < pkg/licenselist/VERSION)"
          latest="$(gh api repos/spdx/license-list-data/releases/latest --jq .tag_name)"
          if ! [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected release tag ${latest}"
            exit 1
          fi
          echo "pinned=${pinned}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [[ "$latest" == "$pinned" ]]; then
            echo "The pinned release ${pinned} is the latest, nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Bumping the pinned release from ${pinned} to ${latest}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump the pin and regenerate the data
        if: steps.latest.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          set -euo pipefail
          printf '%s\n' "$LATEST" > pkg/licenselist/VERSION
          make licenselist

      - name: Open pull request with the bump
        if: steps.latest.outputs.changed == 'true'
        # Opening the PR with GITHUB_TOKEN needs "Allow GitHub Actions to
        # create and approve pull requests" enabled in the organization and
        # repository Actions settings. Without it the branch is still
        # pushed, but this step fails with "GitHub Actions is not permitted
        # to create or approve pull requests".
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automated/bump-license-list
          delete-branch: true
          add-paths: |
            pkg/licenselist/VERSION
            pkg/licenselist/data_gen.go
          commit-message: "Bump the SPDX License List to ${{ steps.latest.outputs.latest }}"
          title: "Bump the SPDX License List to ${{ steps.latest.outputs.latest }}"
          body: |
            Automated bump of the embedded SPDX License List from
            `${{ steps.latest.outputs.pinned }}` to
            `${{ steps.latest.outputs.latest }}`.

            Generated by the `bump-license-list` workflow, which pins the
            latest release of [spdx/license-list-data](https://github.com/spdx/license-list-data/releases)
            in `pkg/licenselist/VERSION` and runs `make licenselist` to
            regenerate `pkg/licenselist/data_gen.go` from it.
